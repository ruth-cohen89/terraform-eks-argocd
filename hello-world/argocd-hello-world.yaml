apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello-world
  namespace: argo-cd
spec:
  project: default
  source:
    repoURL: "https://github.com/ruth-cohen89/terraform-eks-argocd.git"
    # replace to main
    targetRevision: Add_lb_controller
    path: "hello-world"
  destination:
    server: "https://kubernetes.default.svc"
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
